name: Production Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}
on:
  push:
    tags:
      # only on non pre-releases (e.g. v1.0.0, v1.0.5, ...)
      - "v[0-9]+.[0-9]+.[0-9]+"
jobs:
  Check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install dependencies
        run: npm install prettier-plugin-tailwindcss
      - name: Run Formatter
        run: npx prettier --check .
      - name: Run Typechecker
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters --composite false

  Deploy:
    needs: [Check]
    runs-on: ubuntu-latest
    environment:
      name: Production

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Run migrations
        run: npm run prod:migrate-db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deployment
        run: vercel deploy --archive=tgz --prod --token=${{ secrets.VERCEL_TOKEN }}
